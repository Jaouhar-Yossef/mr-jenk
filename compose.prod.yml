services:
  discovery-server:
    image: buy-01-discovery-server:${APP_VERSION}
    build:
      context: ./discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8761/actuator/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    image: buy-01-user-service:${APP_VERSION}
    build:
      context: ./user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      MONGODB_URI: ${USER_MONGODB_URI:?USER_MONGODB_URI is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:?EUREKA URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  product-service:
    image: buy-01-product-service:${APP_VERSION}
    build:
      context: ./product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      MONGODB_URI: ${PRODUCT_MONGODB_URI:?PRODUCT_MONGODB_URI is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:?EUREKA URL is required}
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  media-service:
    image: buy-01-media-service:${APP_VERSION}
    build:
      context: ./media-service
    container_name: media-service
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MEDIA_MONGODB_URI:?MEDIA_MONGODB_URI is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:?EUREKA URL is required}
      CLOUDINARY_URL: ${CLOUDINARY_URL:?CLOUDINARY_URL is required}
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  api-gateway:
    image: buy-01-api-gateway:${APP_VERSION}
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:?EUREKA URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SSL_KEYSTORE_PATH: classpath:keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?Keystore password is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS origin is required}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "--spider",
          "-q",
          "https://localhost:8443/actuator/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    image: buy-01-frontend:${APP_VERSION}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  default:
    name: ecommerce-network